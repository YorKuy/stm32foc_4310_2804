# Segger J-Link over SWD -> STM32F103C6T6
source [find interface/jlink.cfg]
transport select swd
adapter speed 1000

# 多台 J-Link 同时插在电脑上时，OpenOCD 会报
#   Error: Multiple devices found, specify the desired device.
# 必须显式指定用哪台探针。序列号查看方法：
#   lsusb -v -d 1366:0101 | grep iSerial
# 或者跑一次 JLinkExe（不接板也行），它启动时会打印 S/N。
# 换另一台探针就把下面这行改成对应序列号（或拔掉多余的那台）。
jlink serial 000602712882
source [find target/stm32f1x.cfg]

# Most minimal F103 boards do not route SRST to the 20-pin header, so let
# OpenOCD reset through the Cortex-M AIRCR (SYSRESETREQ) instead.
# If your probe does drive NRST, use:
#   reset_config srst_only srst_nogate
reset_config none
